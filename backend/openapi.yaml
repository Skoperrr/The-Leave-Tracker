openapi: 3.0.3
info:
  title: The Leave Tracker API
  version: 0.7.0
  description: Email onboarding, scoped leave workflows and Insights, Google Calendar OAuth/outbox and three Gemini tools (leave drafting, manager review summaries and scoped data questions). AI tools never create or decide leave automatically.
servers:
  - url: http://localhost:3001/api/v1
paths:
  /insights:
    get:
      operationId: getInsights
      summary: Scoped real-data leave planning for active managers and admins
      description: Dates are inclusive, real YYYY-MM-DD from year 2000, with at most
        366 calendar days. Unknown or repeated query fields are rejected. ADMIN sees
        all current active memberships; MANAGER sees current active direct reports only.
        Reports are independent of AI configuration. No private reasons, comments or
        emails are returned.
      security:
      - bearerAuth: []
      parameters:
      - name: organisationId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: allocationYear
        in: query
        required: true
        schema:
          type: integer
          minimum: 2000
          maximum: 9999
      - name: lowBalanceThreshold
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 365
          default: 3
      - name: coverageThresholdPercent
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: A current-workforce planning snapshot. Zero workforce is a valid
            result.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/InsightsResult'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Insights service not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsUnavailableError'
  "/ai/manager-summary":
    post:
      operationId: generateManagerReviewSummary
      summary: Read-only manager/admin summary with grounded flags and source requests
      description: Direct reports for MANAGER, organisation review scope for ADMIN; active members only, excluding the actor. Weekday coverage flags use a 30 percent planning threshold and include pending leave only as a projection. No actual staffing roster is available. Gemini prioritises up to 40 anonymous facts; the server supplies all prose, names, figures and source IDs. All computed attention flags are returned. Default period is today through 30 days later in Africa/Johannesburg; maximum 93 calendar days. More than 500 requests or 1000 reviewable members returns AI_DATA_LIMIT rather than a partial report.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organisationId]
              properties:
                organisationId: {type: string, format: uuid}
                from: {type: string, format: date, description: Supply both from and to or neither}
                to: {type: string, format: date}
      responses:
        '200':
          description: Server-calculated summary and optionally AI-prioritised highlights; no business writes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AiManagerSummary'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: AI_INVALID_OUTPUT or AI_DATA_LIMIT}
        '429': {description: AI_RATE_LIMITED}
        '503': {description: AI_NOT_CONFIGURED or AI_UNAVAILABLE}
        '504': {description: AI_TIMEOUT}
  "/ai/ask-data":
    post:
      operationId: askScopedLeaveData
      summary: Classify a natural-language question and answer with authorised database records
      description: Supported intents are WHO_OFF, COUNT_OFF, PENDING_REQUESTS and MY_BALANCE. Calendar answers use only active approved organisation-visible events. Pending requests require MANAGER/ADMIN and the same review scope as manager summaries. Balances always belong to the verified actor. Unsupported/private/mutation questions return clarification; the model cannot produce SQL. Query windows are bounded to 93 days. The response includes dates, generation timestamp, scope and source rows. Duplicate display names are not treated as the same employee. All endpoints use a shared instance-local AI limiter.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organisationId, question]
              properties:
                organisationId: {type: string, format: uuid}
                question: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: Real-data answer or clarification; no business writes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                    - {$ref: '#/components/schemas/AiDataAnswer'}
                    - {$ref: '#/components/schemas/AiToolClarification'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: AI_INVALID_OUTPUT or AI_DATA_LIMIT}
        '429': {description: AI_RATE_LIMITED}
        '503': {description: AI_NOT_CONFIGURED or AI_UNAVAILABLE}
        '504': {description: AI_TIMEOUT}
  "/ai/leave-draft":
    post:
      operationId: generateLeaveDraft
      summary: Generate a read-only Gemini suggestion; human confirmation and ordinary submission are required
      description: Checks all active organisation memberships before Gemini access. Uses Africa/Johannesburg date context. Makes no business writes, reserves no leave and does not send invitations. Missing Gemini configuration affects only this feature. Balances and overlaps are checked by the ordinary leave submission endpoint, not this preview.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organisationIds, text]
              properties:
                organisationIds:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, format: uuid}
                text: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: Validated suggestion or clarification; nothing has been saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                    - "$ref": "#/components/schemas/AiReadyDraft"
                    - "$ref": "#/components/schemas/AiClarification"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          description: AI_INVALID_OUTPUT; malformed or unsupported provider proposal
        '429':
          description: AI_RATE_LIMITED; local limiter or Gemini quota exhausted; use manual form
        '503':
          description: AI_NOT_CONFIGURED or AI_UNAVAILABLE; manual requests remain available
        '504':
          description: AI_TIMEOUT; no automatic retry or alternate model
  "/auth/profile":
    post:
      operationId: provisionConfirmedEmailProfile
      summary: Provision confirmed account profile; no organisation memberships or roles
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Me"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - fullName
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 120
  "/admin/allocations":
    post:
      operationId: createEmployeeAllocation
      summary: Create allocation within the actor admin organisation
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/AdminAllocation"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - organisationId
              - membershipId
              - leaveTypeId
              - year
              - allocatedDays
              properties:
                organisationId:
                  type: string
                  format: uuid
                membershipId:
                  type: string
                  format: uuid
                leaveTypeId:
                  type: string
                  format: uuid
                year:
                  type: integer
                  minimum: 2000
                  maximum: 9999
                allocatedDays:
                  type: number
                  minimum: 0
                  maximum: 999999.99
                  multipleOf: 0.01
  "/integrations/google/status":
    get:
      operationId: getGoogleCalendarStatus
      summary: Selected organisation admin connection and latest job
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/GoogleStatus"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      parameters:
      - in: query
        name: organisationId
        required: true
        schema:
          type: string
          format: uuid
  "/integrations/google/connect":
    get:
      operationId: connectGoogleCalendar
      summary: Start admin calendar consent; sets HttpOnly browser-binding cookie
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - authorisationUrl
                    - expiresAt
                    properties:
                      authorisationUrl:
                        type: string
                        format: uri
                      expiresAt:
                        type: string
                        format: date-time
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      parameters:
      - in: query
        name: organisationId
        required: true
        schema:
          type: string
          format: uuid
  "/integrations/google/disconnect":
    delete:
      operationId: disconnectGoogleCalendar
      summary: Forget credentials; existing Google events remain; in-flight writes may
        complete
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/GoogleStatus"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      parameters:
      - in: query
        name: organisationId
        required: true
        schema:
          type: string
          format: uuid
  "/integrations/google/settings":
    patch:
      operationId: updateGoogleCalendarSettings
      summary: Validate writable calendar; invitations off by default; queue upcoming
        approved events
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/GoogleStatus"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      parameters:
      - in: query
        name: organisationId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                calendarId:
                  type: string
                  minLength: 1
                  maxLength: 1024
                invitationsEnabled:
                  type: boolean
  "/integrations/google/test":
    post:
      operationId: testGoogleCalendar
      summary: Read-only writable-calendar check; sends no invitations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - calendarId
                    - writable
                    - checkedAt
                    properties:
                      calendarId:
                        type: string
                      writable:
                        type: boolean
                        enum:
                        - true
                      checkedAt:
                        type: string
                        format: date-time
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      parameters:
      - in: query
        name: organisationId
        required: true
        schema:
          type: string
          format: uuid
  "/integrations/google/retry":
    post:
      operationId: retryGoogleCalendarJob
      summary: Retry only failed/waiting jobs in the current organisation integration
        revision
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/GoogleStatus"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - organisationId
              - jobId
              properties:
                organisationId:
                  type: string
                  format: uuid
                jobId:
                  type: string
                  format: uuid
  "/integrations/google/calendars":
    get:
      operationId: listGoogleWritableCalendars
      summary: List writable calendars using only this organisation credentials
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - id
                      - summary
                      - timeZone
                      - accessRole
                      properties:
                        id:
                          type: string
                        summary:
                          type: string
                        timeZone:
                          type: string
                        accessRole:
                          type: string
                          enum:
                          - writer
                          - owner
                  meta:
                    type: object
                    additionalProperties: false
                    required:
                    - nextPageToken
                    properties:
                      nextPageToken:
                        type: string
                        nullable: true
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      parameters:
      - in: query
        name: organisationId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 2048
  "/integrations/google/callback":
    get:
      operationId: completeGoogleCalendarConsent
      summary: Public provider callback; expiring single-use state, PKCE and browser
        nonce replace bearer authentication
      security: []
      parameters:
      - in: query
        name: state
        required: true
        schema:
          type: string
          minLength: 20
          maxLength: 128
      - in: query
        name: code
        schema:
          type: string
          maxLength: 4096
      - in: query
        name: error
        schema:
          type: string
      responses:
        '303':
          description: Fixed configured frontend redirect with non-sensitive result;
            no bearer/token/code in Location
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
  "/internal/google-calendar-sync":
    get:
      operationId: runCalendarWorker
      summary: Scheduler-only; bounded one-job batch; Supabase user tokens are not accepted
      security:
      - cronAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - claimed
                    - succeeded
                    - retried
                    - failed
                    - cancelled
                    properties:
                      claimed:
                        type: integer
                        minimum: 0
                      succeeded:
                        type: integer
                        minimum: 0
                      retried:
                        type: integer
                        minimum: 0
                      failed:
                        type: integer
                        minimum: 0
                      cancelled:
                        type: integer
                        minimum: 0
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
  /admin/memberships:
    post:
      operationId: assignEmployeeMembership
      summary: Assign an existing active signup profile EMPLOYEE access; never accept
        role flags
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/AdminMembership"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/CalendarUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - organisationId
              - email
              properties:
                organisationId:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                managerMembershipId:
                  type: string
                  format: uuid
                  nullable: true
    get:
      operationId: getAdminMemberships
      summary: Read-only memberships in the selected admin organisation, including inactive memberships
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: organisationId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Organisation-scoped memberships with member display names
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminMembership' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /manager/leave-requests:
    get:
      operationId: getManagerRequests
      summary: Assigned team requests; organisation-wide for admins; excludes own requests
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: organisationId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, default: PENDING, enum: [PENDING, APPROVED, DECLINED, CANCELLED] } }
        - { in: query, name: page, schema: { type: integer, default: 1, minimum: 1, maximum: 1000000 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Current authorised team records with employee names and pagination
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ManagerLeaveRequest' }
                  meta:
                    type: object
                    required: [page, pageSize, total]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /manager/leave-requests/{id}/decision:
    post:
      operationId: decideLeave
      summary: Assigned manager or organisation admin decision; self decisions forbidden
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecision' }
      responses:
        '200':
          description: Decision committed with audit and one internal calendar event on approval
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InsufficientBalance' }
        '500': { $ref: '#/components/responses/InternalError' }
  /calendar-events:
    get:
      operationId: getOrganisationCalendar
      summary: Approved organisation absences, without private reason or leave type
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: organisationId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Active events for approved requests overlapping the inclusive date range
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CalendarEvent' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /balances:
    get:
      operationId: getOwnBalances
      summary: Own allocated, approved, pending and remaining days
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: organisationId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: year, description: Defaults to current Johannesburg policy year, schema: { type: integer, minimum: 2000, maximum: 9999 } }
      responses:
        '200':
          description: Own balances in the selected active organisation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LeaveBalance' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /leave-requests:
    post:
      operationId: createOwnLeave
      summary: Atomically submit one or multiple organisation requests
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeave' }
      responses:
        '201':
          description: All selected organisations accepted; groupId is null for a single organisation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [groupId, requests]
                    properties:
                      groupId: { type: string, format: uuid, nullable: true }
                      requests:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InsufficientBalance' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: getOwnLeaveHistory
      summary: Own history across active memberships, with optional organisation/status filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: organisationId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [PENDING, APPROVED, DECLINED, CANCELLED] } }
        - { in: query, name: page, schema: { type: integer, default: 1, minimum: 1, maximum: 1000000 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Own requests sorted by submission timestamp and ID descending
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LeaveRequest' }
                  meta:
                    type: object
                    required: [page, pageSize, total]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /leave-requests/{id}/cancel:
    post:
      operationId: cancelOwnPendingLeave
      summary: Cancel only this pending child request and release its reservation
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated cancelled request
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me:
    get:
      operationId: getMe
      summary: Verified user's database profile and active memberships
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /organisations:
    get:
      operationId: getOrganisations
      summary: Organisations with active membership for the verified user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authorised organisations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organisation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /organisations/{orgId}/leave-types:
    get:
      operationId: getLeaveTypes
      summary: Active leave types in an authorised organisation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leave types
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveType'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      operationId: getHealth
      summary: API process liveness (does not check database or authentication)
      security: []
      responses:
        '200':
          description: API is responding
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
              example:
                data:
                  status: ok
        '403':
          description: Browser origin is outside the configured allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cronAuth:
      type: http
      scheme: bearer
      description: Server-only CRON_SECRET, separate from Supabase user authentication
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access JWT
  responses:
    CalendarUnavailable:
      description: Google Calendar has not been configured on the server
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Missing active leave type or missing/hidden leave request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: OVERLAPPING_REQUEST or STATUS_CONFLICT on conflicting/repeated mutations or changed policy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientBalance:
      description: INSUFFICIENT_BALANCE, including missing allocation for a balance-limited type
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProfileNotFound:
      description: Verified identity has no provisioned application profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Absent or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Inactive profile or no active organisation membership
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidInput:
      description: Invalid fields, date range or pagination
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected database or provider error (sanitised)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    InsightsResult:
      type: object
      additionalProperties: false
      required:
      - organisationId
      - generatedAt
      - timezone
      - period
      - allocationYear
      - scope
      - activeMemberCount
      - thresholds
      - summary
      - lowBalances
      - monthly
      - dailyCoverage
      - byType
      - limitations
      properties:
        organisationId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        timezone:
          type: string
          enum:
          - Africa/Johannesburg
        period:
          type: object
          additionalProperties: false
          required:
          - from
          - to
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        allocationYear:
          type: integer
          minimum: 2000
          maximum: 9999
        scope:
          type: string
          enum:
          - ORGANISATION
          - DIRECT_REPORTS
        activeMemberCount:
          type: integer
          minimum: 0
        thresholds:
          type: object
          additionalProperties: false
          required:
          - lowBalanceDays
          - coveragePercent
          properties:
            lowBalanceDays:
              type: integer
              minimum: 0
              maximum: 365
            coveragePercent:
              type: integer
              minimum: 1
              maximum: 100
        summary:
          type: object
          additionalProperties: false
          required:
          - approvedRequestCount
          - pendingRequestCount
          - approvedPersonDays
          - upcomingApprovedPersonDays
          - coverageWarningDays
          - unallocatedMemberCount
          properties:
            approvedRequestCount:
              type: integer
              minimum: 0
            pendingRequestCount:
              type: integer
              minimum: 0
            approvedPersonDays:
              type: integer
              minimum: 0
            upcomingApprovedPersonDays:
              type: integer
              minimum: 0
            coverageWarningDays:
              type: integer
              minimum: 0
            unallocatedMemberCount:
              type: integer
              minimum: 0
        lowBalances:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - membershipId
            - employeeDisplayName
            - leaveTypeCode
            - leaveTypeName
            - allocatedDays
            - approvedDays
            - pendingDays
            - remainingDays
            properties:
              membershipId:
                type: string
                format: uuid
              employeeDisplayName:
                type: string
              leaveTypeCode:
                type: string
              leaveTypeName:
                type: string
              allocatedDays:
                type: number
              approvedDays:
                type: number
              pendingDays:
                type: number
              remainingDays:
                type: number
        monthly:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - month
            - approvedPersonDays
            properties:
              month:
                type: string
                pattern: ^\d{4}-\d{2}$
              approvedPersonDays:
                type: integer
                minimum: 0
        dailyCoverage:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - date
            - approvedPeople
            - pendingPeople
            - projectedPeople
            - approvedPercent
            - projectedPercent
            - warning
            properties:
              date:
                type: string
                format: date
              approvedPeople:
                type: integer
                minimum: 0
              pendingPeople:
                type: integer
                minimum: 0
              projectedPeople:
                type: integer
                minimum: 0
              approvedPercent:
                type: number
                minimum: 0
                maximum: 100
              projectedPercent:
                type: number
                minimum: 0
                maximum: 100
              warning:
                type: boolean
        byType:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - leaveTypeCode
            - leaveTypeName
            - approvedRequestCount
            - approvedWorkingDays
            properties:
              leaveTypeCode:
                type: string
              leaveTypeName:
                type: string
              approvedRequestCount:
                type: integer
                minimum: 0
              approvedWorkingDays:
                type: integer
                minimum: 0
        limitations:
          type: array
          items:
            type: string
    InsightsUnavailableError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - INSIGHTS_NOT_CONFIGURED
            message:
              type: string
    AiToolFact:
      type: object
      required: [id, kind, text, requestIds, date]
      properties:
        id: {type: string}
        kind: {type: string, enum: [OVERVIEW, CLASH, COVERAGE, WAITING, PAST_START]}
        text: {type: string, description: Canonical server-generated prose from real scoped records}
        requestIds: {type: array, items: {type: string, format: uuid}}
        date: {type: string, format: date, nullable: true}
    AiToolSource:
      type: object
      description: A reviewer source uses id; an approved calendar source uses requestId. Never includes private reasons or decision comments.
      required: [employeeDisplayName, startDate, endDate]
      properties:
        id: {type: string, format: uuid}
        requestId: {type: string, format: uuid}
        employeeDisplayName: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        status: {type: string, enum: [PENDING, APPROVED]}
    AiManagerSummary:
      type: object
      required: [referenceDate, generatedAt, timezone, period, scope, activeMemberCount, pendingCount, approvedCount, summary, highlights, attention, dailyCoverage, sources, aiUsed, coverageThresholdPercent, limitations]
      properties:
        referenceDate: {type: string, format: date}
        generatedAt: {type: string, format: date-time}
        timezone: {type: string, enum: [Africa/Johannesburg]}
        period:
          type: object
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
        scope: {type: string, enum: [ORGANISATION_REVIEW, DIRECT_REPORTS]}
        activeMemberCount: {type: integer, minimum: 0}
        pendingCount: {type: integer, minimum: 0}
        approvedCount: {type: integer, minimum: 0}
        summary: {type: string}
        highlights: {type: array, items: {$ref: '#/components/schemas/AiToolFact'}}
        attention: {type: array, items: {$ref: '#/components/schemas/AiToolFact'}}
        sources: {type: array, items: {$ref: '#/components/schemas/AiToolSource'}}
        aiUsed: {type: boolean, description: False when there are no attention facts to prioritise}
        coverageThresholdPercent: {type: integer, enum: [30]}
        limitations: {type: array, items: {type: string}}
        dailyCoverage:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              approvedPeople: {type: integer}
              projectedPeople: {type: integer}
              approvedPercent: {type: number}
              projectedPercent: {type: number}
              warning: {type: boolean}
    AiToolClarification:
      type: object
      required: [status, referenceDate, generatedAt, timezone, questions]
      properties:
        status: {type: string, enum: [NEEDS_CLARIFICATION]}
        referenceDate: {type: string, format: date}
        generatedAt: {type: string, format: date-time}
        timezone: {type: string, enum: [Africa/Johannesburg]}
        questions: {type: array, items: {type: string}, minItems: 1}
    AiDataAnswer:
      type: object
      required: [status, intent, scope, answer, referenceDate, generatedAt, timezone, rows, balances]
      properties:
        status: {type: string, enum: [ANSWER]}
        intent: {type: string, enum: [WHO_OFF, COUNT_OFF, PENDING_REQUESTS, MY_BALANCE]}
        scope: {type: string, enum: [ORGANISATION_CALENDAR, ORGANISATION_REVIEW, DIRECT_REPORTS, OWN_BALANCE]}
        answer: {type: string, description: Server-generated text using actual query results}
        referenceDate: {type: string, format: date}
        generatedAt: {type: string, format: date-time}
        timezone: {type: string, enum: [Africa/Johannesburg]}
        year: {type: integer}
        period:
          type: object
          nullable: true
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
        interpretation: {type: string}
        limitations: {type: array, items: {type: string}}
        peopleCount: {type: integer, description: Distinct members, not distinct display names}
        requestCount: {type: integer}
        rows: {type: array, items: {$ref: '#/components/schemas/AiToolSource'}}
        balances:
          type: array
          items:
            type: object
            properties:
              leaveTypeName: {type: string}
              year: {type: integer}
              allocatedDays: {type: number}
              approvedDays: {type: number}
              pendingDays: {type: number}
              remainingDays: {type: number}
    AiReadyDraft:
      type: object
      required: [status, referenceDate, timezone, draft, workingDays, warnings]
      properties:
        status: {type: string, enum: [READY]}
        referenceDate: {type: string, format: date}
        timezone: {type: string, enum: [Africa/Johannesburg]}
        draft:
          type: object
          required: [organisationIds, leaveTypeCode, startDate, endDate]
          properties:
            organisationIds:
              type: array
              items: {type: string, format: uuid}
            leaveTypeCode: {type: string}
            startDate: {type: string, format: date}
            endDate: {type: string, format: date}
        workingDays: {type: integer, minimum: 1}
        warnings:
          type: array
          items: {type: string}
    AiClarification:
      type: object
      required: [status, referenceDate, timezone, draft, questions]
      properties:
        status: {type: string, enum: [NEEDS_CLARIFICATION]}
        referenceDate: {type: string, format: date}
        timezone: {type: string, enum: [Africa/Johannesburg]}
        draft: {type: object, nullable: true, enum: [null]}
        questions:
          type: array
          minItems: 1
          maxItems: 4
          items: {type: string}
    AdminAllocation:
      type: object
      additionalProperties: false
      required:
      - id
      - organisationId
      - membershipId
      - leaveTypeId
      - year
      - allocatedDays
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        leaveTypeId:
          type: string
          format: uuid
        year:
          type: integer
        allocatedDays:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GoogleStatus:
      type: object
      additionalProperties: false
      required:
      - organisationId
      - provider
      - connectionStatus
      - calendarId
      - invitationsEnabled
      - lastSync
      properties:
        organisationId:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - GOOGLE
        connectionStatus:
          type: string
          enum:
          - DISCONNECTED
          - CONNECTED
          - REAUTH_REQUIRED
        calendarId:
          type: string
          nullable: true
        invitationsEnabled:
          type: boolean
        lastSync:
          nullable: true
          type: object
          additionalProperties: false
          required:
          - jobId
          - status
          - attemptedAt
          - errorCode
          - invitationStatus
          - recipientCount
          properties:
            jobId:
              type: string
              format: uuid
            status:
              type: string
              enum:
              - PENDING
              - PROCESSING
              - SUCCEEDED
              - RETRY
              - FAILED
              - CANCELLED
            attemptedAt:
              type: string
              format: date-time
              nullable: true
            errorCode:
              type: string
              nullable: true
            invitationStatus:
              type: string
              nullable: true
            recipientCount:
              type: integer
              nullable: true
    ManagerLeaveRequest:
      allOf:
        - { $ref: '#/components/schemas/LeaveRequest' }
        - type: object
          required: [employeeId, employeeDisplayName]
          properties:
            employeeId: { type: string, format: uuid }
            employeeDisplayName: { type: string }
    LeaveDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, DECLINE] }
        comment: { type: string, maxLength: 2000 }
      oneOf:
        - properties:
            decision: { enum: [APPROVE] }
        - required: [comment]
          properties:
            decision: { enum: [DECLINE] }
            comment: { type: string, minLength: 1, pattern: '\S' }
    CalendarEvent:
      type: object
      additionalProperties: false
      required: [id, organisationId, requestId, employeeDisplayName, title, startDate, endDate, allDay]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        employeeDisplayName: { type: string }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        allDay: { type: boolean, enum: [true] }
    CreateLeave:
      type: object
      additionalProperties: false
      required: [organisationIds, leaveTypeCode, startDate, endDate]
      properties:
        organisationIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        leaveTypeCode: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, maxLength: 2000 }
    LeaveBalance:
      type: object
      required: [membershipId, leaveTypeId, year, allocatedDays, approvedDays, pendingDays, remainingDays]
      properties:
        membershipId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        year: { type: integer }
        allocatedDays: { type: number }
        approvedDays: { type: number }
        pendingDays: { type: number }
        remainingDays: { type: number }
    LeaveRequest:
      type: object
      required: [id, groupId, membershipId, organisationId, organisationName, leaveTypeId, leaveTypeName, startDate, endDate, workingDays, reason, status, submittedAt, approverName, decidedAt, decisionComment]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid, nullable: true }
        membershipId: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        organisationName: { type: string }
        leaveTypeId: { type: string, format: uuid }
        leaveTypeName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        workingDays: { type: integer, minimum: 1 }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, DECLINED, CANCELLED] }
        submittedAt: { type: string, format: date-time }
        approverName: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionComment: { type: string, nullable: true }
    Me:
      type: object
      required: [id, email, fullName, memberships]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Membership:
      type: object
      required: [id, organisationId, organisationName, role, managerMembershipId, active]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        organisationName: { type: string }
        role: { type: string, enum: [EMPLOYEE, MANAGER, ADMIN] }
        managerMembershipId: { type: string, format: uuid, nullable: true }
        active: { type: boolean }
    AdminMembership:
      allOf:
        - $ref: '#/components/schemas/Membership'
        - type: object
          required: [employeeDisplayName]
          properties:
            employeeDisplayName:
              type: string
              description: Stored profile name for this membership; admin organisation scope only.
    Organisation:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    LeaveType:
      type: object
      required: [id, organisationId, code, name]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
