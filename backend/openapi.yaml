openapi: 3.0.3
info:
  title: The Leave Tracker API
  version: 0.2.0
  description: Foundation and access endpoints. Protected responses use Cache-Control no-store. Leave workflows and Google integration are pending.
servers:
  - url: http://localhost:3001/api/v1
paths:
  /me:
    get:
      operationId: getMe
      summary: Verified user's database profile and active memberships
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /organisations:
    get:
      operationId: getOrganisations
      summary: Organisations with active membership for the verified user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authorised organisations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organisation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /organisations/{orgId}/leave-types:
    get:
      operationId: getLeaveTypes
      summary: Active leave types in an authorised organisation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leave types
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveType'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      operationId: getHealth
      summary: API process liveness (does not check database or authentication)
      security: []
      responses:
        '200':
          description: API is responding
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
              example:
                data:
                  status: ok
        '403':
          description: Browser origin is outside the configured allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access JWT
  responses:
    ProfileNotFound:
      description: Verified identity has no provisioned application profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Absent or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Inactive profile or no active organisation membership
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidInput:
      description: Invalid organisation UUID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected database or provider error (sanitised)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Me:
      type: object
      required: [id, email, fullName, memberships]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Membership:
      type: object
      required: [id, organisationId, organisationName, role, managerMembershipId, active]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        organisationName: { type: string }
        role: { type: string, enum: [EMPLOYEE, MANAGER, ADMIN] }
        managerMembershipId: { type: string, format: uuid, nullable: true }
        active: { type: boolean }
    Organisation:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    LeaveType:
      type: object
      required: [id, organisationId, code, name]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
